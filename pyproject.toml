requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

[dependency-groups]
default = [
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.4",
    "aiosignal>=1.4.0",
    "attrs>=26.1.0",
    "datasets>=5.1.0",
    "dill>=0.4.1",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "filelock>=4.0.12",
    "frozenlist>=1.8.0",
    "fsspec>=2026.7.0",
    "hf-xet>=1.7.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.1.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "multidict>=6.9.1",
    "multiprocess>=0.70.19",
    "ollama>=0.6.2",
    "openai>=3.16.2",
    "pandas>=2.2.0",
    "propcache>=0.5.4",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.53.0",
    "xxhash>=4.0.1",
    "yarl>=1.25.1",
]
mlx-vlm = [
    "jinja2>=3.1.6",
    "mlx-vlm",
]
mlx-audio = [
    "jinja2>=3.1.6",
    "mlx-audio",
]
dev = [
    "flake8>=7.4.1",
    "iniconfig>=2.3.1",
    "mccabe>=0.7.0",
    "pluggy>=1.7.0",
    "pycodestyle>=2.15.0",
    "pyflakes>=4.0.3",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
default-groups = ["default"]

[tool.pyrefly]
project-includes = ["**/*.py", "notebooks/*.ipynb"]
search-path = ["."]
