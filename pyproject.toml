[project]
name = "workshop-local-llm"
version = "0.1.0"
description = "DIY-AI workshop: local inference on Apple Silicon and NVIDIA CUDA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34",
    "ipykernel>=6.30",
    "ipython>=8.37",
    "ipywidgets>=8.1",
    "jinja2>=3.1.6",
    "jupyterlab>=4.4",
    "pandas>=2.2",
    "requests>=2.32",
]

[dependency-groups]
benchmark = [
    "datasets>=4",
    "docker>=7.1",
    # The pinned upstream api_interface.py imports this SDK.
    "openai>=1.100",
]
mlx-vlm = [
    "mlx-vlm>=0.7.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "nbformat>=5.10",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
default-groups = []
